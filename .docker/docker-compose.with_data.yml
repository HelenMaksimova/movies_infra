name: movies_infra
include:
  - elastic_db/docker-compose.base.yml
  - postgres_db/docker-compose.base.yml
  - redis_db/docker-compose.base.yml
  - nginx/docker-compose.base.yml
  - elastic_indexes/docker-compose.base.yml
  - sqlite_to_pg/docker-compose.base.yml
  - redis_db/docker-compose.tests.yml
  - elastic_db/docker-compose.tests.yml

volumes:
  postgres_data:
    name: postgres_data
  elastic_data:
    name: elastic_data
  redis_data:
    name: redis_data
  nginx_static:
    name: nginx_static
  nginx_media:
    name: nginx_media
  test_elastic_data:
    name: test_elastic_data
  test_redis_data:
    name: test_redis_data

networks:
  movies_net:
    external: true