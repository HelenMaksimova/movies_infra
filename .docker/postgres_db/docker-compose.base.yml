services:
  postgres:
    image: postgres:16
    container_name: postgres
    env_file:
      - ../../postgres_db/.env.db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - movies_net
