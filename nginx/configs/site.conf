server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;  # Обслуживает любой хост
    server_tokens     off;

    root /data;

    # DNS Docker (встроенный resolver)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Динамические апстримы: переменные, чтобы Nginx не резолвил их на старте
    set $admin_upstream http://admin:8000;
    set $app_upstream   http://app:8000;

    location @admin_backend {
        proxy_pass $admin_upstream;
    }

    location ^~ /static/ {
        alias /data/static/;

        expires 90d;
        add_header Cache-Control "public, immutable";

        log_not_found off;

        gzip_static on;

        try_files $uri =404;
    }

    location ^~ /media/ {
        alias /data/media/;

        expires 30d;
        add_header Cache-Control "public";

        log_not_found off;

        try_files $uri =404;
    }

    location /api/ {
        proxy_pass $app_upstream;
    }

    location ~* \.(?:jpg|jpeg|gif|png|ico|css|js)$ {

        root /data;

        log_not_found off;
        expires 90d;
    }

    location / {
        try_files $uri @admin_backend;
    }

    error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   html;
    }
}